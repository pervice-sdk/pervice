name: pervice
description: A Flutter-native MVVM service layer that creates, loads, watches, shares, and disposes services according to the widget lifecycle.
version: 2.4.0
publisher: ttankkeo112@gmail.com
repository: https://github.com/pervice-sdk/pervice
keywords:
  - flutter
  - service
  - mvvm
  - state-management
  - flutter-architecture
  - riverpod-free
  - async-data

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
