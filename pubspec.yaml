name: pervice
description: A Flutter-native MVVM service layer that creates, loads, watches, shares, and disposes services according to the widget lifecycle.
version: 1.5.0
repository: https://github.com/pervice-sdk/pervice
topics:
  - state-management
  - mvvm
  - flutter-architecture
  - reactive-programming
  - hooks

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
